name: Update HSV Dagtekst RSS

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: # Handmatig starten om direct te testen

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-liberation
          pip install beautifulsoup4 pillow
      
      - run: pip install beautifulsoup4

      - name: Genereer RSS feed
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
        run: python generate_rss.py

      - name: Commit en push feed.xml en image.jpg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/image.jpg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update dagtekst" && git push)

